name: SDS Algo 24/7 Cloud Auto-Trader

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Prevents two cloud runs from overlapping and causing git push conflicts
concurrency:
  group: sds-cloud-trader-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan_and_trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository & Cached Parameters
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run 2,995-Bar Scanner & Bybit V5 Demo Executor
        env:
          TIMEFRAME_INTERVAL: "3"
          BYBIT_DEMO_API_KEY: ${{ secrets.BYBIT_DEMO_API_KEY }}
          BYBIT_DEMO_SECRET: ${{ secrets.BYBIT_DEMO_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node cloud_scanner.mjs

      - name: Save Permanent 2,995-Bar (ZZ, Err) Cache to Repository
        run: |
          if [ -f opt_cache.json ]; then
            git config user.name "SDS Cloud Bot"
            git config user.email "bot@github.com"
            git add opt_cache.json
            if ! git diff --staged --quiet; then
              git commit -m "Update 2,995-bar optimized parameters [skip ci]"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
